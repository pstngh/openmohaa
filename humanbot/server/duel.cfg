// humanbot/server/duel.cfg: one human against one human-imitation bot, recorded for evaluation.
//
// Copy this file into the game's main/ folder and start the dedicated server with
//   +exec duel.cfg
// Every setting below matters for the comparison with the recorded human duels; see
// humanbot/TESTING.md for the whole procedure.

// 50 ms server frames: the bot brain and the telemetry both assume them
set sv_fps 20

// free-for-all deathmatch on the practice maps, no limits
set g_gametype 1
set fraglimit 0
set timelimit 0

// normal physics, as in the recordings (the analysis drops anything else)
set sv_runspeed 250
set sv_dmspeedmult 1
set sv_gravity 800

// one bot. sv_maxbots reserves the slots and only takes effect on a map load.
set sv_maxclients 4
set sv_maxbots 2
set sv_numbots 1
set sv_minPlayers 0

// the human-imitation bot (all defaults written out)
set g_humanbot_substeps 4        // usercmds per 50 ms frame
set g_humanbot_fov 80            // the bot's field of view: 80 at 4:3, Hor+ ...
set g_humanbot_aspect 1.778      // ... on a 16:9 screen (96.4 x 64.4 degrees)
set g_humanbot_families ""       // "" = the recorded family mix; or weights "presser strafer stopper", e.g. "1 0 0"
set g_humanbot_seed 0            // 0 = a new style every run; a number repeats the styles
set g_humanbot_disguise 0        // 1 = human names and ping (a blind test)
set g_humanbot_debug 0           // 1 = print each hand-off to the stock code (ladder, door, stuck recovery)

// telemetry: movement_frames.csv, movement_events.csv and movement_meta.txt below
// main/telemetry/. Recording runs only while a human is connected; each visit goes to
// fresh files under telemetry/segments/, and a new segment starts every hour or 512 MB.
set g_movelog 1
set g_movelog_max_seconds 3600
set g_movelog_max_mb 512
set g_movelog_rollover 1
set g_movelog_need_human 1

map dm/crnodoors
