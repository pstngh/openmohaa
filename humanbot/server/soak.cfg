// humanbot/server/soak.cfg: 16 human-imitation bots and no humans, for stability and
// performance (the think-time budget is 150 us per bot per 50 ms frame).
//
// Copy into main/ and run a dedicated server with +exec soak.cfg. Leave it running for
// a few hours across map changes, then check the console for errors and
// "humanbot_list" / the bot_think_us column of the telemetry for the think time.

set sv_fps 20
set g_gametype 1
set fraglimit 0
set timelimit 15                 // a map change every 15 minutes

set sv_runspeed 250
set sv_dmspeedmult 1
set sv_gravity 800

set sv_maxclients 2
set sv_maxbots 16
set sv_numbots 16
set sv_minPlayers 0

set g_humanbot_substeps 4
set g_humanbot_seed 0

// short telemetry segments (bots only: this is not duel data, keep it out of the evaluation)
set g_movelog 1
set g_movelog_max_seconds 900
set g_movelog_max_mb 1024

set sv_maprotation "map dm/mohdm1 map dm/mohdm2 map dm/mohdm3 map dm/mohdm4 map dm/mohdm5 map dm/mohdm6 map dm/mohdm7"
map dm/mohdm1
