name: "Builds"

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-bot-server-linux-x64:
    if: >-
      github.ref_name == 'agent/bot-telemetry-server' ||
      github.head_ref == 'agent/bot-telemetry-server' ||
      github.ref_name == 'agent/bot-demo-route-graphs' ||
      github.head_ref == 'agent/bot-demo-route-graphs'
    name: "Build Linux x64 dedicated server"
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          bison \
          clang \
          cmake \
          flex \
          ninja-build

    - name: Configure server-only build
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DBUILD_CLIENT=OFF \
          -DBUILD_SERVER=ON \
          -DBUILD_GAME_LIBRARIES=ON \
          -DBUILD_GAME_QVMS=OFF \
          -DBUILD_RENDERER_GL1=OFF \
          -DBUILD_RENDERER_GL2=OFF \
          -DBUILD_STANDALONE=OFF \
          -DBUILD_MACOS_BUNDLE=OFF \
          -DBUILD_TESTING=OFF \
          -DUSE_OPENAL=OFF \
          -DUSE_HTTP=OFF \
          -DUSE_CODEC_VORBIS=OFF \
          -DUSE_CODEC_OPUS=OFF \
          -DUSE_CODEC_MAD=OFF \
          -DUSE_VOIP=OFF \
          -DUSE_MUMBLE=OFF \
          -DUSE_FREETYPE=OFF

    - name: Build dedicated server binaries
      run: |
        cmake --build build --parallel --target omohaaded game

    - name: Package only dedicated server binaries
      run: |
        mkdir package
        cp build/RelWithDebInfo/omohaaded package/
        cp build/RelWithDebInfo/game.so package/

    - name: Verify artifact contents and architecture
      run: |
        test "$(find package -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf 'game.so\nomohaaded')"
        file package/omohaaded | grep -q 'ELF 64-bit.*x86-64'
        file package/game.so | grep -q 'ELF 64-bit.*x86-64'

    - uses: actions/upload-artifact@v4
      with:
        name: openmohaa-bot-server-linux-x64
        if-no-files-found: error
        compression-level: 9
        path: package

  build-all:
    if: >-
      github.ref_name != 'agent/bot-telemetry-server' &&
      github.head_ref != 'agent/bot-telemetry-server' &&
      github.ref_name != 'agent/bot-demo-route-graphs' &&
      github.head_ref != 'agent/bot-demo-route-graphs'
    uses: ./.github/workflows/shared-build.yml
    with:
      environment: 'testing'

  # Initially create a release with 1 job
  # so multiple files can be uploaded at the same time afterwards
  create-release:
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    environment: 'testing'
    needs: [build-all]

    steps:
    - name: Release
      uses: softprops/action-gh-release@v2.3.2
      with:
        prerelease: true
        name: '${{github.ref_name}}-${{github.sha}}'
        tag_name: 'dev'

  deploy-release:
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    strategy:
      matrix:
        target_os: [
          'macos-arm64',
        ]

    runs-on: ubuntu-24.04
    environment: 'testing'
    needs: [create-release]

    env:
      RELEASE_NAME: ${{github.event.repository.name}}-dev-${{matrix.target_os}}

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: 'out-${{matrix.target_os}}'
        path: ${{github.workspace}}/${{matrix.target_os}}

    - name: Zip
      working-directory: '${{github.workspace}}/${{matrix.target_os}}'
      run: zip -9 -r "../${{env.RELEASE_NAME}}.zip" ./

    - name: Release
      uses: softprops/action-gh-release@v2.3.2
      with:
        tag_name: 'dev'
        files: ${{github.workspace}}/${{env.RELEASE_NAME}}.zip
