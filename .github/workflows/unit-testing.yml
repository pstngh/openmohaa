name: "Unit Tests"

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Running unit tests"
    runs-on: ubuntu-latest
    environment: "testing"

    steps:
    - uses: actions/checkout@v4

    # The runner image provides python3 and the c++ compiler the tests use
    - name: Test
      # Every test file runs even after one fails, and finding none fails the job
      run: |
        status=0
        count=0
        for test_file in $(find code hud -path '*/tests/test_*.py' | sort); do
          count=$((count + 1))
          python3 "$test_file" < /dev/null || status=1
        done
        if [ "$count" -eq 0 ]; then
          echo "No tests found"
          exit 1
        fi
        exit $status

  # The C++ tests of the human-imitation bots (cmake/tests): the brain, the telemetry
  # headers and the Pmove sub-steps. They need no client, so the build skips it and
  # does not depend on SDL2 or OpenAL.
  ctest:
    name: "Running C++ unit tests (human-imitation bots)"
    runs-on: ubuntu-latest
    environment: "testing"

    steps:
    - uses: awalsh128/cache-apt-pkgs-action@latest
      name: Install required packages
      with:
        packages: flex bison ninja-build cmake clang
        version: "${{ runner.os }}-${{ runner.arch }}-unittest-v2"

    - uses: actions/checkout@v4
      with:
        path: 'source'

    - name: Settings
      working-directory: ${{github.workspace}}
      run: |
        echo "CMAKE_GENERATOR=Ninja Multi-Config" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CMAKE_PARAM=--log-level=VERBOSE \
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/install' \
        -DBUILD_CLIENT=OFF" >> $GITHUB_ENV

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        cmake -B ./build ${{ env.CMAKE_PARAM }} ./source

    - name: Build
      working-directory: ${{github.workspace}}
      run: |
        cmake --build ${{github.workspace}}/build --config Debug --parallel

    - name: Test
      working-directory: ${{github.workspace}}
      run: |
        cd "${{github.workspace}}/build"
        ctest -C Debug --output-on-failure
