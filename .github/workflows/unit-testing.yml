name: "Unit Tests"

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Running unit tests"
    runs-on: ubuntu-latest
    environment: "testing"

    steps:
    - uses: actions/checkout@v4

    # The runner image provides python3 and the c++ compiler the tests use
    - name: Test
      # Every test file runs even after one fails, and finding none fails the job
      run: |
        status=0
        count=0
        for test_file in $(find code -path '*/tests/test_*.py' | sort); do
          count=$((count + 1))
          python3 "$test_file" < /dev/null || status=1
        done
        if [ "$count" -eq 0 ]; then
          echo "No tests found"
          exit 1
        fi
        exit $status
