name: "Unit Tests"

on:
  push:
    branches-ignore:
      - 'agent/bot-telemetry-server'
      - 'agent/bot-demo-route-graphs'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.head_ref != 'agent/bot-telemetry-server' &&
      github.head_ref != 'agent/bot-demo-route-graphs'
    name: "Running unit tests"
    runs-on: ubuntu-latest
    environment: "testing"

    steps:
    - name: Install required packages
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          flex bison ninja-build cmake clang libsdl2-dev libopenal-dev

    - uses: actions/checkout@v4
      with:
        path: 'source'

    - name: Settings
      working-directory: ${{github.workspace}}
      run: |
        echo "CMAKE_GENERATOR=Ninja Multi-Config" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CMAKE_PARAM=--log-level=VERBOSE \
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/install'" \
        -DUSE_RENDERER_DLOPEN=OFF \
        -DBUILD_RENDERER_GL2=OFF >> $GITHUB_ENV

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        cmake -B ./build ${{ env.CMAKE_PARAM }} ./source

    - name: Build
      working-directory: ${{github.workspace}}
      run: |
        cmake --build ${{github.workspace}}/build --config Debug --parallel

    - name: Test
      working-directory: ${{github.workspace}}
      run: |
        cd "${{github.workspace}}/build"
        ctest -C Debug --output-on-failure
