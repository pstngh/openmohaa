##########################
#
# Linux (server-only, amd64)
# Ubuntu 22.04
#
# Server-only fork: only the dedicated server binary and the native game
# modules are built (no client, renderers, SDL2, OpenAL, cURL or QVMs).
#
# Built natively on an x86_64 runner. We do NOT cross-compile: the previous
# setup ran on an ARM runner and relied on clang --target, which silently fell
# back to the host arch and produced ARM binaries labelled "amd64".
##########################
name: "Linux Builds"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  RELEASE_STAGE: ${{ vars.RELEASE_STAGE || 'unstable' }}

jobs:
  build:
    name: "Building linux-amd64 server"
    runs-on: ubuntu-22.04
    environment: ${{ inputs.environment }}

    steps:
    ###
    # Packages
    ###

    - uses: awalsh128/cache-apt-pkgs-action@latest
      name: Install required packages
      with:
        packages: flex bison ninja-build cmake clang
        version: "${{ runner.os }}-${{ runner.arch }}-v1"

    - name: Settings
      working-directory: ${{github.workspace}}
      run: |
        echo "CMAKE_GENERATOR=Ninja Multi-Config" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV

    ###
    # Project (server only)
    ###

    - uses: actions/checkout@v4
      with:
        path: 'source'

    - name: CMake Settings
      run: |
        echo "CMAKE_PARAM=--log-level=VERBOSE \
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/install' \
        -DBUILD_CLIENT=OFF \
        -DBUILD_SERVER=ON \
        -DBUILD_GAME_LIBRARIES=ON \
        -DBUILD_GAME_QVMS=OFF \
        -DUSE_HTTP=OFF \
        -DGIT_REVISION_BUILD_NUMBER=${{ github.run_number }} \
        -DPRODUCT_VERSION_STAGE='${{ env.RELEASE_STAGE }}'" >> $GITHUB_ENV

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        cmake -B ./build ${{ env.CMAKE_PARAM }} ./source

    - name: Build
      working-directory: ${{github.workspace}}
      run: |
        cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel

    - name: Install
      working-directory: ${{github.workspace}}
      # Install to the directory defined in CMAKE_INSTALL_PREFIX
      run: |
        cmake --install ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
        # Copy the dedicated server binary and native game modules
        mkdir ${{github.workspace}}/package
        if [ -d ${{github.workspace}}/install/bin ]; then cp -r ${{github.workspace}}/install/bin/openmohaa/. '${{github.workspace}}/package'; fi
        if [ -d ${{github.workspace}}/install/lib ]; then cp -r ${{github.workspace}}/install/lib/openmohaa/. '${{github.workspace}}/package'; fi

    ###
    # Artifacts
    ###

    - uses: actions/upload-artifact@v4
      with:
        name: out-linux-amd64
        if-no-files-found: error
        compression-level: 9
        path:
          ${{github.workspace}}/package
